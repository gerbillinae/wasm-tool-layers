[package]
name = "tool-serve"
description = "The host's HTTP listener on hyper, native only: socket, localhost, Origin and Host checks, forwarding to the tool's own HTTP handler; and the serve command."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tool-contract.workspace = true
tool-cli.workspace = true
serde_json.workspace = true
clap.workspace = true
ctrlc = { version = "3", features = ["termination"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
